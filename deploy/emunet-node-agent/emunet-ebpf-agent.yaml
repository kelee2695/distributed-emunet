apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: emunet-ebpf-agent
  namespace: kube-system
spec:
  selector:
    matchLabels:
      name: emunet-ebpf-agent
  template:
    metadata:
      labels:
        name: emunet-ebpf-agent
    spec:
      tolerations:
      - key: dedicated
        operator: Equal
        value: emu-master
        effect: NoSchedule
      - key: node-role.kubernetes.io/master
        operator: Exists
        effect: NoSchedule
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      
      dnsPolicy: ClusterFirst
      
      initContainers:
        - name: install-cni
          image: 100.75.179.29:5000/emunet-node-agent:latest
          imagePullPolicy: Always
          command: ["/install-cni.sh"]
          volumeMounts:
          - name: cni-bin-dir
            mountPath: /opt/cni/bin
          - name: cni-conf-dir
            mountPath: /etc/cni/net.d

      containers:
      - name: node-agent
        image: 100.75.179.29:5000/emunet-node-agent:latest
        imagePullPolicy: Always
        command: ["/node-agent"]
        args: ["-redis-addr=emunet-redis.kube-system:6379", "-node-name=$(MY_NODE_NAME)"]
        env:
        - name: MY_NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        ports:
        - containerPort: 12345
          hostPort: 12345
          protocol: TCP
        securityContext:
          privileged: true
        volumeMounts:
        - name: bpf-fs
          mountPath: /sys/fs/bpf

      volumes:
      - name: cni-bin-dir
        hostPath:
          path: /opt/cni/bin
          type: DirectoryOrCreate
      - name: cni-conf-dir
        hostPath:
          path: /etc/cni/net.d
      - name: bpf-fs
        hostPath:
          path: /sys/fs/bpf
          type: DirectoryOrCreate