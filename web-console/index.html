<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EmuNet Console</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="topbar" aria-label="连接">
        <div>
          <p class="eyebrow">EmuNet Console</p>
          <h1>Pod 与链路控制台</h1>
        </div>
        <div class="connection">
          <label>
            <span>LinkServer</span>
            <input id="linkserver-url" type="url" spellcheck="false" value="http://localhost:8082" />
          </label>
          <button id="save-config" class="primary">保存</button>
          <button id="check-health">检测</button>
          <span id="health-pill" class="pill muted">未检测</span>
        </div>
      </section>

      <section class="grid">
        <div class="panel control-panel">
          <div class="panel-head">
            <div>
              <h2>Pod 启停</h2>
              <p id="emunet-status">创建或更新 EmuNet 实例</p>
            </div>
            <button id="refresh-emunets">刷新实例</button>
          </div>

          <div class="inline-form">
            <label>
              <span>Namespace</span>
              <input id="namespace" value="default" />
            </label>
            <label>
              <span>Name</span>
              <input id="emunet-name" value="emunet-example" />
            </label>
          </div>

          <div id="image-groups" class="image-groups"></div>

          <div class="actions">
            <button id="add-group">增加镜像组</button>
            <button id="start-emunet" class="primary">启动/更新 Pod</button>
            <button id="stop-emunet" class="danger">关闭 Pod</button>
          </div>

          <div class="instance-list-wrap">
            <h3>实例列表</h3>
            <div id="emunet-list" class="instance-list">
              <div class="empty block">暂无实例</div>
            </div>
          </div>
        </div>

        <div class="panel rule-panel">
          <div class="panel-head">
            <div>
              <h2>链路规则</h2>
              <p>通过 Pod 名称下发双向 eBPF 规则</p>
            </div>
            <span id="rule-status" class="pill muted">就绪</span>
          </div>
          <div class="rule-form">
            <label>
              <span>Pod 1</span>
              <select id="pod1"></select>
            </label>
            <label>
              <span>Pod 2</span>
              <select id="pod2"></select>
            </label>
            <label>
              <span>带宽 bps</span>
              <input id="throttle" type="number" min="0" step="1" value="0" />
            </label>
            <label>
              <span>延迟 0.01ms</span>
              <input id="delay" type="number" min="0" step="1" value="1000" />
            </label>
            <label>
              <span>丢包 0.01%</span>
              <input id="loss" type="number" min="0" max="10000" step="1" value="0" />
            </label>
            <label>
              <span>抖动 0.01ms</span>
              <input id="jitter" type="number" min="0" step="1" value="0" />
            </label>
          </div>
          <div class="actions">
            <button id="apply-rule" class="primary">应用规则</button>
            <button id="delete-rule" class="danger">删除规则</button>
          </div>
          <div class="ping-box">
            <div class="panel-head compact">
              <div>
                <h3>Ping 测试</h3>
                <p>从 Pod 1 ping Pod 2，观察 RTT 与丢包</p>
              </div>
              <span id="ping-status" class="pill muted">就绪</span>
            </div>
            <div class="ping-form">
              <label>
                <span>次数</span>
                <input id="ping-count" type="number" min="1" max="10" step="1" value="4" />
              </label>
              <label>
                <span>单包超时 s</span>
                <input id="ping-timeout" type="number" min="1" max="10" step="1" value="2" />
              </label>
              <button id="run-ping" class="primary">开始 Ping</button>
            </div>
            <pre id="ping-output" class="ping-output">暂无测试结果</pre>
          </div>
        </div>

        <div class="panel monitor-panel">
          <div class="panel-head">
            <div>
              <h2>Pod 监控</h2>
              <p id="pod-summary">自动刷新摘要；表格手动刷新</p>
            </div>
            <div class="monitor-actions">
              <label class="check-row">
                <input id="auto-refresh" type="checkbox" checked />
                <span>自动刷新</span>
              </label>
              <label class="page-size-label">
                <span>每页</span>
                <select id="pod-page-size">
                  <option value="50">50</option>
                  <option value="100" selected>100</option>
                  <option value="200">200</option>
                  <option value="500">500</option>
                </select>
              </label>
              <button id="prev-pods">上一页</button>
              <button id="next-pods">下一页</button>
              <button id="refresh-pods">刷新详情</button>
            </div>
          </div>
          <div class="metric-row">
            <div>
              <span>Desired</span>
              <strong id="metric-desired">0</strong>
            </div>
            <div>
              <span>Ready</span>
              <strong id="metric-ready">0</strong>
            </div>
            <div>
              <span>MAC</span>
              <strong id="metric-mac">0</strong>
            </div>
            <div>
              <span>Nodes</span>
              <strong id="metric-nodes">0</strong>
            </div>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Pod</th>
                  <th>Phase</th>
                  <th>Node</th>
                  <th>IP</th>
                  <th>MAC</th>
                  <th>ifindex</th>
                </tr>
              </thead>
              <tbody id="pod-table">
                <tr>
                  <td colspan="6" class="empty">暂无数据</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>

        <div class="panel topology-panel">
          <div class="panel-head">
            <div>
              <h2>拓扑规则</h2>
              <p id="topology-summary">按空间位置生成链路参数并批量下发</p>
            </div>
            <span id="topology-status" class="pill muted">就绪</span>
          </div>
          <div class="topology-controls">
            <label>
              <span>网络规则</span>
              <select id="topology-rule">
                <option value="grid">网格邻接</option>
                <option value="ring">环形相邻</option>
                <option value="nearest">空间 k 近邻</option>
              </select>
            </label>
            <label>
              <span>节点上限</span>
              <input id="topology-node-limit" type="number" min="2" max="1000" step="1" value="200" />
            </label>
            <label>
              <span>k 近邻</span>
              <input id="topology-neighbors" type="number" min="1" max="12" step="1" value="4" />
            </label>
            <label>
              <span>基础延迟 0.01ms</span>
              <input id="topology-base-delay" type="number" min="0" step="1" value="100" />
            </label>
            <label>
              <span>距离延迟 0.01ms</span>
              <input id="topology-distance-delay" type="number" min="0" step="1" value="2000" />
            </label>
            <label>
              <span>最大丢包 0.01%</span>
              <input id="topology-max-loss" type="number" min="0" max="10000" step="1" value="200" />
            </label>
            <label>
              <span>抖动系数 0.01ms</span>
              <input id="topology-jitter-scale" type="number" min="0" step="1" value="200" />
            </label>
            <label>
              <span>带宽 bps</span>
              <input id="topology-bandwidth" type="number" min="0" step="1" value="0" />
            </label>
            <label>
              <span>动态间隔 ms</span>
              <input id="topology-dynamic-interval" type="number" min="500" step="100" value="1000" />
            </label>
            <label>
              <span>移动幅度 %</span>
              <input id="topology-motion-scale" type="number" min="0" max="30" step="1" value="6" />
            </label>
            <label>
              <span>批量大小</span>
              <input id="topology-batch-size" type="number" min="10" max="5000" step="10" value="500" />
            </label>
            <label>
              <span>批量并发</span>
              <input id="topology-batch-concurrency" type="number" min="1" max="8" step="1" value="2" />
            </label>
          </div>
          <div class="actions">
            <button id="load-topology-pods">加载节点</button>
            <button id="preview-topology">生成预览</button>
            <button id="apply-topology" class="primary">下发拓扑规则</button>
            <button id="start-dynamic-topology" class="primary">启动动态规则</button>
            <button id="stop-dynamic-topology">停止动态规则</button>
            <button id="clear-topology-rules">清空全部规则</button>
            <button id="cancel-topology" class="danger">停止下发</button>
          </div>
          <div class="topology-canvas-wrap">
            <canvas id="topology-canvas" width="1200" height="520"></canvas>
          </div>
        </div>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
